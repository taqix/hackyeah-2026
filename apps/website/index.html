<script>/* theme init — plain JS, runs before paint */
(function(){var t;try{t=localStorage.getItem("movo-site-theme")}catch(e){}
var m=matchMedia("(prefers-color-scheme: dark)");
document.documentElement.dataset.theme=t||(m.matches?"dark":"light");
if(!t)m.addEventListener("change",function(e){var s;try{s=localStorage.getItem("movo-site-theme")}catch(_){}if(!s)document.documentElement.dataset.theme=e.matches?"dark":"light";});})();
</script>
