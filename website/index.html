<style>
/* ============ Site CSS — every class is prefixed s- ============ */

        ["Arms and balance", [["Wall push-up", sets(k), "hands on a wall"], ["Bird dog", sets(k - 2) + " each side", "slow, on hands and knees"], ["Standing knee lift", sets(k - 2) + " each side", "hold a wall if needed"]]],

      ["Wall passing", [["Wall passes", R + " × " + k + " each foot", "a step back each round"], ["Stop the ball", R + " × " + k, "sole trap"]]],

  function sessionReason(sport, index, kickabout, comfort, slot, restBefore) {

  function feedbackReplies(plan, o, feeling, revisedOnce) {

  const RX = {
    health: /\b(pain|painful|hurts?|hurting|injur(y|ies|ed)|ill|illness|sick|doctor|physio|medic(al|ation|ine)|pregnan(t|cy)|asthma|diabet(es|ic)|blood pressure|heart condition)\b/,

    harder: /\b(harder|more challenging|challenge|push me|too easy)\b/,
    easier: /\b(easier|easy|gentler|gentle|too hard|too much|hard|tired)\b/,
    longer: /\b(longer|more time|too short)\b/,
    shorter: /\b(shorter|short|less time|quick|quicker|no time|too long)\b/,
    rest: /\b(rest|fewer|less often|day off|recover)\b/,
    switchVerb: /\b(switch|change|try|instead|rather|swap)\b/,

  const refuse = (intent, text) => ({ ok: false, intent, text });

      if (b.title === s.title && JSON.stringify(b.rows) === JSON.stringify(s.rows)) continue;
      const was = b.title !== s.title ? s.title : levelValue(s.sport, p.L);
      const now = b.title !== s.title ? b.title : levelValue(s.sport, nl);
      rows.push({ ...dayCols(plan, s.offset), was, now });
      s.title = b.title; s.rows = b.rows;
    }
    params.L = nl; params.source.L = { version: plan.versions.length + 1 };
    const f = lastFeeling && lastFeeling.feeling;
    const fDay = lastFeeling ? wdName(dateAt(plan, lastFeeling.offset)) : "";
    let cause;
    if (dir < 0) cause = f === "hard" ? "you said " + fDay + " felt hard" : f === "much" ? "you said " + fDay + " felt like too much" : "you asked for easier";
    else cause = f === "easy" ? "you said " + fDay + " felt easy" : "you asked for more";
    const lead = dir < 0
      ? { running: "Shorter run bits, longer walks", fitness: "Fewer reps", gym: "Fewer reps, still light", football: "Shorter drills" }[p.sport]
      : (p.sport === "running" ? "Longer run bits" : "A few more reps");
    return finish(plan, intent, { sessions, params, rows, explanation: lead + " — " + cause + ".", label: dir < 0 ? "A bit easier" : "A bit harder" });
  }
  function effectRest(plan, intent) {
    const v = activeVersion(plan);
    const target = sortByOffset(v.sessions.filter(s => !s.done && s.offset > plan.todayOffset)).pop();
    if (!target || v.sessions.length <= 1) return refuse(intent, "One session is the fewest we plan this week." + UNCHANGED);
    const name = wdName(dateAt(plan, target.offset));
    const params = copyParams(v), sessions = copySessions(v).filter(s => s.id !== target.id);
    params.D = sessions.length; params.source.days = { version: plan.versions.length + 1 };
    return finish(plan, intent, { sessions, params, removed: true,
      explanation: name + " is now a rest day — you asked for more rest.", label: "One more rest day",
      rows: [{ ...dayCols(plan, target.offset), was: target.title, now: "Rest day" }] });
  }
  function effectSwitch(plan, intent, sport) {
    const v = activeVersion(plan), p = v.params;
    if (p.sport === sport) return refuse(intent, "This is already a " + SPORTS[sport].name.toLowerCase() + " plan." + UNCHANGED);
    const params = copyParams(v), sessions = copySessions(v), rows = [];
    const maxIndex = Math.max(...sessions.map(s => s.index));
    const live = sortByOffset(sessions.filter(s => !s.done));
    for (const s of live) {
      const kick = isKick(sport, p.withOthers, sessions.length, s.index, maxIndex);
      const b = buildSession(sport, s.index, p.L, s.minutes, kick);
      rows.push({ ...dayCols(plan, s.offset), was: s.title, now: b.title });
      Object.assign(s, { sport, title: b.title, rows: b.rows, kickabout: kick });
    }
    params.sport = sport; params.source.sport = { version: plan.versions.length + 1 };
    const fromWord = live[0].offset === plan.todayOffset ? "today" : wdName(dateAt(plan, live[0].offset));
    const lower = SPORTS[sport].name.toLowerCase();
    return finish(plan, intent, { sessions, params, rows,
      explanation: "Switched to " + lower + " from " + fromWord + " — you asked to try it.", label: "Switched to " + lower });
  }

  /* One message in, one decision out. ctx = { lastFeeling: {feeling, offset} | null } */
  function runPipeline(plan, input, ctx = {}) {
    const t = String(input || "").toLowerCase().trim();
    const v = activeVersion(plan);
    const live = () => v.sessions.some(s => !s.done);
    const allDone = intent => refuse(intent, "Every session this week is done. Nothing left to change here.");
    let m;
    if (RX.health.test(t)) return refuse("health", "Plans can't take pain or health conditions into account. If something hurts or you feel unwell, check with a doctor or physio." + UNCHANGED);
    if ((m = t.match(RX.scope))) {
      const w = m[1];
      if (/marathon|ultra|triathlon/.test(w)) return refuse("scope", (/^[aeiou]/.test(w) ? "An " : "A ") + w + " is beyond a beginner plan. Sessions can get a little longer instead." + UNCHANGED);
      if (/lose|weight/.test(w)) return refuse("scope", "This plan is about moving more, not weight." + UNCHANGED);
      return refuse("scope", "That's beyond a beginner first week." + UNCHANGED);
    }
    for (const [rx, name] of OTHER_RX) if (rx.test(t)) return refuse("other-sport", name + " isn't one of the sports we plan." + UNCHANGED);
    if (RX.busy.test(t)) {
      if ((m = t.match(RX.day))) {
        if (!live()) return allDone("move");
        let o;
        if (m[1] === "today") o = plan.todayOffset;
        else if (m[1] === "tomorrow") o = plan.todayOffset + 1;
        else { const wd = WD.map(x => x.toLowerCase()).indexOf(m[1]); for (let i = 0; i < 7; i++) if (dateAt(plan, i).getDay() === wd) o = i; }
        return effectMove(plan, "move", o);
      }
      const said = firstMatch(BUSY_SLOT_RX, t);
      if (said) {
        const cur = v.params.slot;
        if (said !== cur) return refuse("busy-slot", "Sessions are already " + SLOTS[cur].inPhrase + ", not " + SLOTS[said].inPhrase + "." + UNCHANGED);
        if (!live()) return allDone("slot-swap");
        const to = SWAP[cur];
        return effectSlot(plan, "slot-swap", to, "Moved to " + SLOTS[to].plural + " — you said " + SLOTS[cur].plural + " are busy.");
      }
      return refuse("busy", "Which day or time is busy? Try “Busy Monday” or “Mornings are busy”." + UNCHANGED);
    }
    if (RX.harder.test(t)) return live() ? effectLevel(plan, "harder", +1, ctx.lastFeeling) : allDone("harder");
    if (RX.easier.test(t)) return live() ? effectLevel(plan, "easier", -1, ctx.lastFeeling) : allDone("easier");
    if (RX.longer.test(t)) return live() ? effectMinutes(plan, "longer", +1) : allDone("longer");
    if (RX.shorter.test(t)) return live() ? effectMinutes(plan, "shorter", -1) : allDone("shorter");
    const ask = firstMatch(ASK_SLOT_RX, t);
    if (ask) {
      if (ask === v.params.slot) return refuse("slot", "Sessions are already " + SLOTS[ask].inPhrase + "." + UNCHANGED);
      if (!live()) return allDone("slot");
      return effectSlot(plan, "slot", ask, "Moved to " + SLOTS[ask].plural + " — you asked for " + SLOTS[ask].plural + ".");
    }
    if (RX.rest.test(t)) return live() ? effectRest(plan, "rest") : allDone("rest");
    if (RX.switchVerb.test(t)) {
      const sp = firstMatch(SWITCH_RX, t);
      if (sp) {
        if (sp === v.params.sport) return refuse("switch", "This is already a " + SPORTS[sp].name.toLowerCase() + " plan." + UNCHANGED);
        return live() ? effectSwitch(plan, "switch", sp) : allDone("switch");
      }
    }
    return refuse("fallback", "We couldn't turn that into a plan change. Try one of the suggestions — your plan hasn't changed.");
  }
  /* Undo → the plan before the newest change. Sessions marked done since keep their outcome. */
  function undoLast(plan) {
    if (plan.versions.length < 2) return plan;
    const last = plan.versions[plan.versions.length - 1], prev = plan.versions[plan.versions.length - 2];
    const done = new Map(last.sessions.filter(s => s.done).map(s => [s.id, s]));
    const sessions = prev.sessions.map(s => (!s.done && done.has(s.id) ? done.get(s.id) : s));
    return { ...plan, active: prev.n, versions: [...plan.versions.slice(0, -2), { ...prev, sessions }] };
  }
  /* Accepted change → new active version, straight away. */
  function applyEffect(plan, result, now) {
    if (!result || !result.ok) return plan;
    const version = { ...result.version, at: now };
    return { ...plan, active: version.n, versions: [...plan.versions, version] };
  }

  return {
    COMFORT, PLACES, COMPANY, TAGS, SESSION_RANGE, MINUTE_RANGE, SLOTS, SLOT_ORDER, SPORT_ORDER, SPORTS, WEIGHTS,
    OFFSETS, FEELINGS, SAMPLE_ANSWERS, DECLINE_CHIP,
    cap, comfortOf, levelOf, tagOf, feelingOf, fmtSec,
    startOfDay, addDays, wdName, wdShort, wdInitial, fmtShort, fmtDayDate, fmtLong, fmtRange, dayWord, relTime,
    scoreSports, matchedBadges, reasonLine, buildSession, sessionReason, coachTip,
    buildPlan, buildSamplePlan, activeVersion, dateAt, sessionAt, sortByOffset, markDone,
    placeEchoes, companyEchoes, timeLine, step4Body, suggestionBody, planningKicker, planningSteps, headerBody, whyLines,
    openingChat, feedbackReplies, chips, runPipeline, applyEffect, undoLast,
  };
})();

function parseRoute(hash) {
  const p = (hash || "").replace(/^#/, "");
  if (p === "/how") return { view: "landing", anchor: "how", key: p };

/* Arrow keys move focus and selection between [role=radio] items in a group, wrapping. */
function radioArrows(e) {
  const keys = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 };
  if (!(e.key in keys)) return;
  const items = [...e.currentTarget.querySelectorAll('[role="radio"]')];
  const i = items.indexOf(document.activeElement);
  if (i < 0) return;
  e.preventDefault();
  const nx = items[(i + keys[e.key] + items.length) % items.length];
  nx.focus(); nx.click();
}

function summaryLine(answers, sport, visited) {
  const c = Logic.comfortOf(answers.comfort);
  const parts = [];
  if (c) parts.push(Logic.cap(c.echo));
  parts.push(...Logic.placeEchoes(answers), ...Logic.companyEchoes(answers));
  if (visited >= 3) parts.push(Logic.timeLine(answers));
  if (visited >= 4 && sport) parts.push(Logic.SPORTS[sport].name);
  return parts.length ? "So far: " + parts.join(" · ") : "";
}

/* Labelled range input with the current value spelled out; keyboard and screen readers get the native slider. */
function SliderField({ id, label, icon, range, value, onChange, format, ends }) {
  const pct = ((value - range.min) / (range.max - range.min)) * 100;
  return (
    <div className="s-group">
      <div className="s-grouphead"><h2 id={id} className="s-sect">{label}</h2></div>
      <div className="s-slider">
        <div className="s-sliderval" aria-hidden="true"><Icon name={icon} size={18} />{format(value)}</div>
        <input type="range" className="s-range" min={range.min} max={range.max} step={range.step} value={value}
          aria-labelledby={id} aria-valuetext={format(value)} style={{ "--pct": pct + "%" }}
          onChange={e => onChange(Number(e.target.value))} />
        <div className="s-sliderends" aria-hidden="true"><span>{ends[0]}</span><span>{ends[1]}</span></div>
      </div>
    </div>
  );
}

function StepView({ n, answers, setAnswers, ranked, sport, setSport, visited, hasPlan, onChoose, bp, today }) {
  const h1Id = "s-h1";
  const panel = <Panel answers={answers} sport={visited >= 4 ? sport : null} visited={visited} today={today} />;
  const summary = summaryLine(answers, sport, visited);
  const upd = patch => setAnswers(a => ({ ...a, ...patch }));
  const toggle = (field, key) => setAnswers(a => ({ ...a, [field]: a[field].includes(key) ? a[field].filter(x => x !== key) : [...a[field], key] }));
  const common = { n, h1Id, bp, panel, summary: n === 1 && !answers.comfort ? "" : summary };
  const next = () => go("#/try/" + (n + 1));

  if (n === 1) return (
    <StepShell {...common} body="No wrong answers. This sets how gentle your first week is."
      cta={{ label: "Continue", disabled: !answers.comfort, onClick: next }} ctaNote={!answers.comfort ? "Pick one to continue." : null}>
      <div role="radiogroup" aria-labelledby={h1Id} className="s-stack8" onKeyDown={radioArrows}>
        {Logic.COMFORT.map(c => <Radio key={c.value} variant="card" label={c.label} description={c.desc} checked={answers.comfort === c.value} onChange={() => upd({ comfort: c.value })} />)}
      </div>
    </StepShell>
  );
  if (n === 2) return (
    <StepShell {...common} body="We use these to suggest a sport." cta={{ label: "Continue", disabled: !answers.places.length, onClick: next }}>
      <div className="s-col" style={{ gap: 28 }}>
        <TagGroup id="s-g-places" label="Where could you move?" caption="Pick at least one.">
          {Logic.PLACES.map(p => <Tag key={p.key} icon={p.icon} selected={answers.places.includes(p.key)} onClick={() => toggle("places", p.key)} style={{ height: 44 }}>{p.label}</Tag>)}
        </TagGroup>
        <TagGroup id="s-g-company" label="Who would you move with?" caption="Optional.">
          {Logic.COMPANY.map(p => <Tag key={p.key} icon={p.icon} selected={answers.company.includes(p.key)} onClick={() => toggle("company", p.key)} style={{ height: 44 }}>{p.label}</Tag>)}
        </TagGroup>
      </div>
    </StepShell>
  );
  if (n === 3) return (
    <StepShell {...common} body="Pick what feels easy. You can change it later." cta={{ label: "Continue", onClick: next }}>
      <div className="s-col" style={{ gap: 28 }}>
        <SliderField id="s-g-often" label="How often would you like to make room for movement?" icon="calendar-days"
          range={Logic.SESSION_RANGE} value={answers.sessions} onChange={d => upd({ sessions: d })}
          format={d => d + " " + (d === 1 ? "session" : "sessions") + " a week"} ends={["1", "7"]} />
        <SliderField id="s-g-length" label="What feels manageable for one session?" icon="timer"
          range={Logic.MINUTE_RANGE} value={answers.minutes} onChange={m => upd({ minutes: m })}
          format={m => m + " min"} ends={["5 min", "60 min"]} />
        <TagGroup id="s-g-when" label="When would you prefer to move?">
          {Logic.SLOT_ORDER.map(k => <Tag key={k} icon={Logic.SLOTS[k].icon} selected={answers.slot === k} onClick={() => upd({ slot: k })} style={{ height: 44 }}>{Logic.SLOTS[k].label}</Tag>)}
        </TagGroup>
      </div>
    </StepShell>
  );
  /* step 4 */
  const sel = ranked.find(r => r.key === sport) || ranked[0];
  const S = Logic.SPORTS[sel.key];
  const isBest = ranked[0].key === sel.key;
  const sportKeys = e => {
    const keys = { ArrowDown: 1, ArrowRight: 1, ArrowUp: -1, ArrowLeft: -1 };
    if (!(e.key in keys)) return;
    e.preventDefault();
    const i = ranked.findIndex(r => r.key === sel.key);
    const nx = ranked[(i + keys[e.key] + ranked.length) % ranked.length];
    setSport(nx.key);
    requestAnimationFrame(() => { const b = document.getElementById("s-sport-" + nx.key); if (b) b.focus(); });
  };
  return (
    <StepShell {...common} bodySmall body={Logic.step4Body(answers)} ctaNoteAbove={hasPlan ? "Choosing again makes a new first plan." : null}
      cta={{ label: "Choose " + S.name.toLowerCase(), onClick: onChoose }}>
      <div key={sel.key} className="s-xfade">

/* ============ planning moment ============ */
function PlanningView({ answers, sport, today, onDone }) {
  const reduced = useRef(reducedNow()).current;
  const steps = useMemo(() => Logic.planningSteps(sport, answers, today), []);
  const [done, setDone] = useState(reduced ? 4 : 0);   // steps completed
  const [parts, setParts] = useState(reduced ? 4 : 0); // check parts ticked
  const [said, setSaid] = useState("");
  useEffect(() => {
    const T = [], at = (ms, f) => T.push(setTimeout(f, ms));
    if (reduced) {
      at(30, () => setSaid("Your first week is ready."));
      at(800, onDone);
    } else {
      at(550, () => { setDone(1); setSaid(steps[0].label); });
      at(1100, () => { setDone(2); setSaid(steps[1].label); });
      [160, 320, 480, 640].forEach((ms, i) => at(1100 + ms, () => setParts(i + 1)));
      at(1900, () => { setDone(3); setSaid(steps[2].label); });
      at(2300, () => { setDone(4); setSaid(steps[3].label + ". Your first week is ready."); });
      at(2600, onDone);
    }
    return () => T.forEach(clearTimeout);
  }, []);
  const icon = i => {
    if (i < done) return <span key="d" className={reduced ? "" : "s-pop"} style={{ display: "flex" }}><Icon name="circle-check" size={22} style={{ color: "var(--success)" }} /></span>;
    if (i === done) return <span key="a" className="s-spin" style={{ display: "flex", color: "var(--accent-text)" }}><Icon name="loader-circle" size={22} /></span>;
    return <Icon name="circle-dashed" size={22} style={{ color: "var(--text-tertiary)" }} />;
  };
  return (
    <div className="s-wrap">
      <div className="s-planning s-enter">
        <Card padding={24} style={{ padding: "clamp(20px, 5vw, 32px)" }}>
          <div className="s-col" style={{ gap: 24 }}>
            <div className="s-col" style={{ gap: 10 }}>
              <Kicker>{Logic.planningKicker(sport, answers)}</Kicker>
              <h1 className="s-h1" tabIndex={-1} data-page-title="">Planning your week</h1>
            </div>
            <div className="s-col" style={{ gap: 10 }}>
              {steps.map((s, i) => (
                <div key={s.label} className={"s-pstep" + (i > done ? " is-pending" : "")}>
                  <span className="s-picon">{icon(i)}</span>
                  <span className="s-col" style={{ gap: 3, minWidth: 0 }}>
                    <span className="s-plabel">{s.label}</span>
                    {s.caption ? <span className="s-cap">{s.caption}</span> : null}
                    {s.parts ? <span className="s-checks">{s.parts.map((p, j) => (
                      <span key={p}>{j < parts ? <Icon name="check" size={14} style={{ color: "var(--success)" }} /> : null}{p}</span>
                    ))}</span> : null}
                  </span>
                </div>
              ))}
            </div>
            <MiniStrip today={today} D={answers.sessions} sport={sport} phase={done >= 2 ? "fill" : "ring"} />
          </div>
        </Card>
        <p className="s-sr" aria-live="polite">{said}</p>
      </div>
    </div>
  );
}

/* ============ dialogs ============ */
function SiteDialog({ open, onClose, className, labelledBy, children, focusAfter, fallbackFocus }) {
  const ref = useRef(null), opener = useRef(null), closeRef = useRef(onClose), fbRef = useRef(fallbackFocus);
  closeRef.current = onClose; if (fallbackFocus) fbRef.current = fallbackFocus;
  useEffect(() => {
    const d = ref.current;
    const h = () => {
      closeRef.current();
      const t = (focusAfter && focusAfter.current) || opener.current;
      if (focusAfter) focusAfter.current = null;
      setTimeout(() => {
        let el = typeof t === "string" ? document.getElementById(t) : t;
        if ((!el || !el.isConnected) && fbRef.current) el = document.getElementById(fbRef.current);
        if (el && el.focus) el.focus();
      }, 0);
    };
    d.addEventListener("close", h);
    return () => d.removeEventListener("close", h);
  }, []);
  useEffect(() => {
    const d = ref.current;
    if (open && !d.open) { opener.current = document.activeElement; d.showModal(); }
    if (!open && d.open) d.close();
  }, [open]);
  return (
    <dialog ref={ref} className={"s-dialog " + (className || "")} aria-labelledby={labelledBy} onClick={e => { if (e.target === ref.current) ref.current.close(); }}>
      {open ? children : null}
    </dialog>
  );
}

/* ============ chat ============ */
function ChatBody({ plan, chat, busy, chipsList, onSend, onUndo, onStartOver, bp, onSeePlan, onClose, inDialog }) {
  const [text, setText] = useState("");
  const logRef = useRef(null);
  /* New messages never jump the view to the end. If the first new one is out of sight,
     bring its top into view and let the reader scroll on from there. */
  useEffect(() => {
    const log = logRef.current, first = log && log.querySelector("[data-fresh]");
    if (!first) return;
    const r = first.getBoundingClientRect();
    const box = inDialog ? log.getBoundingClientRect() : { top: 64, bottom: window.innerHeight };
    if (r.top >= box.top && r.top <= box.bottom - 48) return;
    first.scrollIntoView({ block: "start", behavior: reducedNow() ? "auto" : "smooth" });
  }, [chat.length]);
  const submit = e => { e.preventDefault(); const t = text.trim(); if (!t || busy) return; setText(""); onSend(t); };
  const narrow = bp !== "desktop";
  return (
    <div className="s-chat">
      <div className="s-chathead">
        <Icon name="message-circle" size={20} style={{ color: "var(--accent-text)" }} />
        <div className="s-col" style={{ flex: 1, minWidth: 0, gap: 2 }}>
          <h2 id="s-chat-h" className="s-sub">Change your plan</h2>
          <span className="s-cap">Changes apply straight away</span>
        </div>
        {inDialog ? <IconButton icon="x" label="Close" onClick={onClose} /> : null}
      </div>
      <div className="s-log" role="log" aria-live="polite" aria-labelledby="s-chat-h" ref={logRef} tabIndex={0}>
        {chat.map((m, i) => {
          const cls = "s-logitem" + (m.fresh && !reducedNow() ? " s-new" : "");
          const mark = m.fresh && !chat.slice(0, i).some(x => x.fresh) ? "" : undefined;
          if (m.kind === "user") return <div key={m.id} className={cls} data-fresh={mark}><DemoBubble me>{m.text}</DemoBubble></div>;
          if (m.kind === "coach") return <div key={m.id} className={cls} data-fresh={mark}><DemoBubble>{m.text}</DemoBubble></div>;
          if (m.kind === "checking") return (
            <div key={m.id} className={cls} data-fresh={mark}><div className="s-checking">
              <span className={reducedNow() ? "" : "s-spin"} style={{ display: "flex", color: "var(--accent-text)" }}><Icon name="loader-circle" size={18} /></span>Checking the change…
            </div></div>
          );
          if (m.kind === "refusal") return (
            <div key={m.id} className={cls} data-fresh={mark}><DemoBubble>{m.text}</DemoBubble><Fine icon="lock">Plan unchanged</Fine></div>
          );
          if (m.kind === "result") {
            const latest = !m.undone && plan.active === m.res.n && plan.versions.length === m.res.n;
            return <div key={m.id} className={cls} data-fresh={mark}><ChangeCard rows={demoRows(m.res)} kept={m.res.foot} undone={m.undone}
              onUndo={latest ? () => onUndo(m.res.n) : null} onSeePlan={narrow && !m.undone ? () => onSeePlan(m.res) : null} /></div>;
          }
          if (m.kind === "closing") return (
            <div key={m.id} className={cls} data-fresh={mark}>
              <Card variant="accent" padding={20}>
                <div className="s-col" style={{ gap: 10 }}>
                  <h3 className="s-h3">That's the journey.</h3>
                  <p className="s-bodysm">Answers, a sport, a first week, and {m.kept ? "a change that kept what you'd done" : "a change applied straight away"}. Keep asking, or start again with different answers.</p>
                  <div className="s-row" style={{ gap: 12, flexWrap: "wrap", marginTop: 4 }}>
                    <Button variant="secondary" icon="rotate-ccw" onClick={onStartOver}>Start over</Button>
                  </div>
                </div>
              </Card>
            </div>
          );
          return null;
        })}
      </div>
      {!busy ? (
        <div className="s-chips">
          <div className="s-tags" role="group" aria-label="Suggestions">
            {chipsList.map(c => <Tag key={c.id} onClick={() => onSend(c.text)} style={{ height: 44, ...(c.accent ? { border: "1px solid var(--accent)", boxShadow: "inset 0 0 0 1px var(--accent)" } : null) }}>{c.label}</Tag>)}
          </div>
        </div>
      ) : null}
      <form className="s-compose" onSubmit={submit}>
        <input className="s-input" aria-label="Ask for a change" placeholder="Ask for a change…" maxLength={140} value={text} disabled={busy} onChange={e => setText(e.target.value)} />
        <IconButton variant="primary" icon="arrow-up" label="Send" disabled={!text.trim() || busy} onClick={submit} />
      </form>
    </div>
  );
}

/* ============ app ============ */
function App() {
  const [hash, setHash] = useState(location.hash);
  const [navTick, setNavTick] = useState(0);
  const route = parseRoute(hash);
  const bp = useBP();
  const [theme, setTheme] = useState(document.documentElement.dataset.theme || "light");
  const [answers, setAnswers] = useState(EMPTY_ANSWERS);
  const [sportPick, setSportPick] = useState(null);
  const [visited, setVisited] = useState(0);
  const [pending, setPending] = useState(false);
  const [plan, setPlan] = useState(null);
  const [chat, setChat] = useState([]);
  const [lastFeeling, setLastFeeling] = useState(null);
  const [busy, setBusy] = useState(false);
  const [revisedOnce, setRevisedOnce] = useState(false);
  const [ui, setUi] = useState({ selectedOffset: 0, dialog: null, chatOpen: false });
  const [ticked, setTicked] = useState([]);
  const [status, setStatus] = useState("");
  const ids = useRef(0);
  const live = useRef({});
  live.current = { plan, lastFeeling, revisedOnce };
  const today = Logic.startOfDay(new Date());

  const ranked = useMemo(() => Logic.scoreSports(answers), [answers]);
  const sport = sportPick && ranked.some(r => r.key === sportPick) ? sportPick : ranked[0].key;

  /* router */
  useEffect(() => {
    history.scrollRestoration = "manual";
    const h = () => { setHash(location.hash); setNavTick(t => t + 1); };
    addEventListener("hashchange", h);
    return () => removeEventListener("hashchange", h);
  }, []);
  useEffect(() => {
    const obs = new MutationObserver(() => setTheme(document.documentElement.dataset.theme || "light"));
    obs.observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
    return () => obs.disconnect();
  }, []);
  let redirect = null;
  if (route.view === "step") {
    const first = !answers.comfort ? 1 : !answers.places.length ? 2 : null;
    if (first && route.step > first) redirect = "#/try/" + first;
  } else if (route.view === "planning" && !pending) redirect = plan ? "#/try/plan" : "#/try/1";
  else if (route.view === "plan" && !plan) redirect = "#/try/1";
  useLayoutEffect(() => { if (redirect) location.replace(redirect); }, [redirect, hash]);

  useEffect(() => { if (route.view === "step") setVisited(v => Math.max(v, route.step)); }, [hash]);

  /* sample guest */
  useEffect(() => {
    if (route.view !== "sample") return;
    const now = new Date(), p = Logic.buildSamplePlan(Logic.startOfDay(now), now);
    setAnswers({ ...Logic.SAMPLE_ANSWERS }); setSportPick("running"); setVisited(4);
    startPlan(p);
    location.replace("#/try/plan");
  }, [hash]);

  /* focus, scroll and title on every route change */
  const firstRun = useRef(true);
  useEffect(() => {
    if (redirect || route.view === "sample") return;
    const isFirst = firstRun.current; firstRun.current = false;
    const raf = requestAnimationFrame(() => {
      if (route.anchor) {
        const sec = document.getElementById(route.anchor), h2 = sec && sec.querySelector("h2");
        /* Put the section heading just under the sticky top bar, not the section's padded edge. */
        const head = sec && (sec.querySelector(".s-sechead") || sec);
        if (head) window.scrollTo({ top: head.getBoundingClientRect().top + window.scrollY - 64 - 32, behavior: reducedNow() || isFirst ? "auto" : "smooth" });
        if (h2 && !isFirst) h2.focus({ preventScroll: true });
      } else {
        window.scrollTo(0, 0);
        const h1 = document.querySelector("main h1[data-page-title]");
        if (h1 && !isFirst) h1.focus({ preventScroll: true });
      }
      const h1 = document.querySelector("main h1[data-page-title]");
      document.title = route.view === "landing" ? "Movo · Everyone starts somewhere" : (h1 ? h1.textContent + " · Movo demo" : "Movo demo");
    });
    return () => cancelAnimationFrame(raf);
  }, [route.key, navTick, !!redirect]);

  const toggleTheme = () => {
    const next = theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem("movo-site-theme", next); } catch (e) {}
    setTheme(next);
  };
  const push = items => setChat(c => [...c.map(m => (m.fresh ? { ...m, fresh: false } : m)), ...items.map(m => ({ id: "m" + (++ids.current), fresh: true, ...m }))]);

  function startPlan(p) {
    setPlan(p);
    setChat(Logic.openingChat(p).map(t => ({ id: "m" + (++ids.current), kind: "coach", text: t })));
    setLastFeeling(null); setRevisedOnce(false); setBusy(false); setStatus("");
    setUi({ selectedOffset: p.todayOffset, dialog: null, chatOpen: false });
  }
  const choose = () => {
    const now = new Date();
    startPlan(Logic.buildPlan({ answers, sport, today: Logic.startOfDay(now), now }));
    setSportPick(sport);
    setPending(true);
    go("#/try/planning");
  };
  const startOver = () => {
    setAnswers(EMPTY_ANSWERS); setSportPick(null); setVisited(0); setPending(false); setPlan(null); setChat([]);
    setLastFeeling(null); setBusy(false); setRevisedOnce(false); setStatus(""); setUi({ selectedOffset: 0, dialog: null, chatOpen: false });
    if (location.hash === "#/try/1") setNavTick(t => t + 1); else go("#/try/1");
  };
  const answerHero = v => { setAnswers(a => ({ ...a, comfort: v })); go("#/try/2"); };
  const markDone = () => setUi(u => ({ ...u, dialog: { ...u.dialog, mode: "feedback" } }));
  const save = ({ feeling, note, ticked: tk }) => {
    const o = ui.dialog.offset;
    const np = Logic.markDone(plan, o, { feeling, note, ticked: tk });
    setPlan(np);
    setUi(u => ({ ...u, dialog: null }));
    setStatus("Saved · " + Logic.feelingOf(feeling).phrase + ".");
    setLastFeeling({ feeling, offset: o });
    push(Logic.feedbackReplies(np, o, feeling, revisedOnce).map(t => ({ kind: "coach", text: t })));
  };
  const send = text => {
    if (busy) return;
    push([{ kind: "user", text }, { kind: "checking", id: "checking" }]);
    setBusy(true);
    setTimeout(() => {
      const { plan: p, lastFeeling: lf, revisedOnce: ro } = live.current;
      const res = Logic.runPipeline(p, text, { lastFeeling: lf });
      setChat(c => c.filter(m => m.kind !== "checking"));
      if (!res.ok) {
        push([{ kind: "refusal", text: res.text }]);
      } else {
        setPlan(Logic.applyEffect(p, res, new Date()));
        const items = [{ kind: "coach", text: res.explanation }, { kind: "result", res: { n: res.n, rows: res.rows, foot: res.foot } }];
        if (!ro) items.push({ kind: "closing", kept: p.versions.some(v => v.sessions.some(x => x.done)) });
        push(items);
        setRevisedOnce(true);
      }
      setBusy(false);
    }, reducedNow() ? 300 : 700);
  };
  /* Undo the newest change: back to the plan before it, keeping anything marked done since. */
  const undo = n => {
    const p = live.current.plan;
    if (busy || !p || p.active !== n || p.versions.length !== n) return;
    setPlan(Logic.undoLast(p));
    setChat(c => c.map(m => (m.kind === "result" && m.res.n === n && !m.undone ? { ...m, undone: true } : m)));
    setStatus("Change undone.");
  };
  const skip = e => { e.preventDefault(); const m = document.getElementById("s-main"); if (m) m.focus(); };
  const toTop = () => { window.scrollTo({ top: 0, behavior: reducedNow() ? "auto" : "smooth" }); const h1 = document.querySelector("main h1[data-page-title]"); if (h1) h1.focus({ preventScroll: true }); };

  let view = null;
  const ready = !redirect && route.view !== "sample";
  if (ready) {
    if (route.view === "landing") view = <Landing answers={answers} onAnswer={answerHero} bp={bp} />;
    else if (route.view === "step") view = <StepView n={route.step} answers={answers} setAnswers={setAnswers} ranked={ranked} sport={sport} setSport={setSportPick}
      visited={Math.max(visited, route.step)} hasPlan={!!plan} onChoose={choose} bp={bp} today={today} />;
    else if (route.view === "planning") view = <PlanningView answers={answers} sport={sport} today={today}
      onDone={() => { setPending(false); location.replace("#/try/plan"); }} />;
    else if (route.view === "plan") view = <PlanView plan={plan} chat={chat} busy={busy} lastFeeling={lastFeeling} status={status} ui={ui} setUi={setUi}
      ticked={ticked} setTicked={setTicked} onMarkDone={markDone} onSave={save} onSend={send} onUndo={undo} onStartOver={startOver} bp={bp} />;
  }
  const isLanding = route.view === "landing";
  return <>
    <a className="s-skip" href="#/" onClick={skip}>Skip to content</a>
    {isLanding
      ? <SiteHeaderLanding hasPlan={!!plan} theme={theme} onTheme={toggleTheme} />
      : <DemoHeader onStartOver={startOver} theme={theme} onTheme={toggleTheme} bp={bp} />}
    <main id="s-main" tabIndex={-1}>{view}</main>
    {isLanding ? <SiteFooter onTop={toTop} /> : null}
  </>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
})();
</script>
<script>
/* Live reload — dev only. Runs only on a local host, so the served page makes no other network calls. */
(function(){
  if(!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) return;
  const files=["index.html","system/components.js","system/styles.css",
    ...["fonts","colors","typography","spacing","effects","base"].map(f=>"system/tokens/"+f+".css")];
  const seen={};
  async function check(){
    for(const f of files){
      try{
        const r=await fetch(f,{method:"HEAD",cache:"no-store"});
        const v=r.headers.get("Last-Modified")+"|"+r.headers.get("Content-Length");
        if(seen[f]&&seen[f]!==v){location.reload();return;}
        seen[f]=v;
      }catch(e){}
    }
  }
  check();setInterval(check,1000);
})();
</script>
</body></html>
